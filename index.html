    <!-- Strict Portrait Lock Script for Android Devices -->
    <script>
      (function() {
        function enforcePortraitOrientation() {
          try {
            if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
              window.screen.orientation.lock('portrait').catch(function() {
                window.screen.orientation.lock('portrait-primary').catch(function() {});
              });
            } else if (typeof window.screen?.lockOrientation === 'function') {
              window.screen.lockOrientation('portrait');
            } else if (typeof window.screen?.mozLockOrientation === 'function') {
              window.screen.mozLockOrientation('portrait');
            } else if (typeof window.screen?.msLockOrientation === 'function') {
              window.screen.msLockOrientation('portrait');
            }
          } catch (e) {}
        }

        enforcePortraitOrientation();
        window.addEventListener('orientationchange', enforcePortraitOrientation);
        window.addEventListener('resize', enforcePortraitOrientation);
        document.addEventListener('DOMContentLoaded', enforcePortraitOrientation);
        document.addEventListener('touchstart', enforcePortraitOrientation, { passive: true, once: true });
        document.addEventListener('click', enforcePortraitOrientation, { passive: true, once: true });
      })();
    </script>

    <!-- Service Worker Registration & Automatic Version Sync -->
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    installingWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                };
              }
            };
          }).catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
